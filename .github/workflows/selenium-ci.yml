name: Selenium TestNG CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1-5'
  workflow_dispatch:

jobs:
  test:
    name: Tests on ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # Pin Chrome to stable — avoids version mismatch with WebDriverManager
      - name: Install Chrome (stable)
        if: matrix.browser == 'chrome'
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # Install Firefox explicitly — not always present on ubuntu-latest
      - name: Install Firefox
        if: matrix.browser == 'firefox'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y firefox

      - name: Run tests
        run: |
          mvn clean test \
            -Dbrowser=${{ matrix.browser }} \
            -Dheadless=true \
            -Dsurefire.useFile=false
        env:
          CI: true

      - name: Upload Surefire reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-report-${{ matrix.browser }}
          path: target/surefire-reports/
          retention-days: 30