name: Selenium TestNG CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1-5'
  workflow_dispatch:

jobs:
  test:
    name: Tests on ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Install Chrome (stable)
        if: matrix.browser == 'chrome'
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true
          install-dependencies: true

      - name: Install Firefox
        if: matrix.browser == 'firefox'
        id: setup-firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      - name: Install Geckodriver
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-geckodriver@latest

      - name: Run tests
        run: |
          MVN_ARGS=(
            clean test
            -DsuiteXmlFile=src/test/resources/testng-ci.xml
            -Dbrowser=${{ matrix.browser }}
            -Dheadless=true
            -Dsurefire.useFile=false
          )

          if [ "${{ matrix.browser }}" = "chrome" ]; then
            MVN_ARGS+=(
              -Dwebdriver.chrome.driver="${{ steps.setup-chrome.outputs.chromedriver-path }}"
              -Dwebdriver.chrome.binary="${{ steps.setup-chrome.outputs.chrome-path }}"
            )
          else
            MVN_ARGS+=(
              -Dwebdriver.firefox.bin="${{ steps.setup-firefox.outputs.firefox-path }}"
            )
            GECKO_DRIVER="$(command -v geckodriver || true)"
            if [ -n "$GECKO_DRIVER" ]; then
              MVN_ARGS+=(
                -Dwebdriver.gecko.driver="$GECKO_DRIVER"
              )
            fi
          fi

          mvn "${MVN_ARGS[@]}"
        env:
          CI: true

      - name: Upload Surefire reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: surefire-report-${{ matrix.browser }}
          path: target/surefire-reports/
          retention-days: 30
