name: Selenium TestNG CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1-5'
  workflow_dispatch:

jobs:
  test:
    name: Tests on ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Install Chrome (stable)
        if: matrix.browser == 'chrome'
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true
          install-dependencies: true

      - name: Install Firefox
        if: matrix.browser == 'firefox'
        id: setup-firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      - name: Install Geckodriver
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-geckodriver@latest

      - name: Run tests
        run: |
          # Sequential suite avoids parallel WebDriver / driver-manager races in CI
          cat > ci-testng.xml <<'SUITE'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE suite SYSTEM "https://testng.org/testng-1.0.dtd">
          <suite name="CI Suite" verbose="1" parallel="none">
            <test name="Home Page Tests">
              <classes>
                <class name="com.qa.tests.HomeTest"/>
              </classes>
            </test>
            <test name="Registration Tests">
              <classes>
                <class name="com.qa.tests.RegisterTest"/>
              </classes>
            </test>
          </suite>
          SUITE

          MVN_ARGS=(
            clean test
            -DsuiteXmlFiles=ci-testng.xml
            -Dbrowser=${{ matrix.browser }}
            -Dheadless=true
            -Dsurefire.useFile=false
          )

          if [ "${{ matrix.browser }}" = "chrome" ]; then
            MVN_ARGS+=(
              -Dwebdriver.chrome.driver="${{ steps.setup-chrome.outputs.chromedriver-path }}"
              -Dwdm.browserVersion="${{ steps.setup-chrome.outputs.chrome-version }}"
              -Dwdm.chromeDriverVersion="${{ steps.setup-chrome.outputs.chromedriver-version }}"
            )
          fi

          mvn "${MVN_ARGS[@]}"
        env:
          CI: true

      - name: Upload Surefire reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: surefire-report-${{ matrix.browser }}
          path: target/surefire-reports/
          retention-days: 30
